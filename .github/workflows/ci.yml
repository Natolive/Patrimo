# Chaque push et PR : lint, tests avec couverture (vraie base Postgres), typecheck du front.
# Push sur main : image de prod construite en parallèle et publiée sur GHCR (ghcr.io/natolive/patrimo:<sha>),
# puis, si tout est vert, déploiement : clé SSH qui ne peut lancer que /srv/patrimo/deploy.sh <sha>.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18.6
        env:
          POSTGRES_USER: patrimo
          POSTGRES_PASSWORD: patrimo
          POSTGRES_DB: patrimo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patrimo -d patrimo"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://patrimo:patrimo@localhost:5432/patrimo
    steps:
      - uses: actions/checkout@v5
      # Même version que l'image du Dockerfile.
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -w backend
      - run: npm run lint -w backend
      - run: npm run test:cov -w backend
      - run: npm run typecheck -w frontend

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ghcr.io/natolive/patrimo:${{ github.sha }}
          # Lie l'image au dépôt (même visibilité, visible dans « Packages »).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Sans attestation : une seule version par commit dans GHCR, ce qui garde le nettoyage simple.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Garde les 10 dernières images (versions où l'on peut revenir), supprime les plus anciennes.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: patrimo
          package-type: container
          min-versions-to-keep: 10

  deploy:
    needs: [test, image]
    runs-on: ubuntu-24.04
    concurrency: deploy
    steps:
      - name: Déploie sur le serveur
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy nathan@57.129.174.3 ${{ github.sha }}
