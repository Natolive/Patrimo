# Production (serveur) : lancé par /srv/patrimo/deploy.sh après chaque push sur main.
# Caddy (stack à part, /srv/caddy) sert https://patrimo.natolive.fr et joint le front via le réseau externe `proxy`.
# Seul le service `patrimo` rejoint `proxy` (nom unique : les noms de service y sont partagés entre projets).
# `.env` à côté de ce fichier (non versionné) : POSTGRES_PASSWORD, IMAGE_TAG.
name: patrimo

# Image construite par la CI (GHCR) ; IMAGE_TAG (sha du commit déployé) est écrit dans `.env` par deploy.sh.
x-app: &app
  image: ghcr.io/natolive/patrimo:${IMAGE_TAG:?IMAGE_TAG manquant dans .env}
  restart: unless-stopped
  environment: &env
    NODE_ENV: production

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: patrimo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: patrimo
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrimo -d patrimo"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *app
    working_dir: /repo/backend
    # Migrations par drizzle-orm (drizzle-kit, outil de dev, n'est pas dans l'image).
    command: sh -c "node dist/migrate.js && exec node dist/main.js"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *env
      DATABASE_URL: postgres://patrimo:${POSTGRES_PASSWORD}@db:5432/patrimo
      COOKIE_SECURE: "true"
      CORS_ORIGIN: https://patrimo.natolive.fr
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  patrimo:
    <<: *app
    working_dir: /repo/frontend
    command: node .output/server/index.mjs
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *env
      NUXT_PUBLIC_API_URL: /api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [default, proxy]

volumes:
  db-data:

networks:
  proxy:
    external: true
